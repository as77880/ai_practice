<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="metaTheme" content="#f4f6ff">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("aiTutor.theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>AI Practice Tutor</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><style>.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <symbol id="i-practice" viewBox="0 0 24 24"><path class="s" d="M9 21h6m-7-3h8M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-doubt" viewBox="0 0 24 24"><path class="s" d="M4 5h16v11H9l-5 4z"/><path class="s" d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .7-1 1.2"/></symbol>
  <symbol id="i-progress" viewBox="0 0 24 24"><path class="s" stroke-width="2.4" d="M5 20V11m7 9V4m7 16v-6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.8 7-6.7 0-3-1.8-5-3.4-6.6-.2 1.5-.9 2.4-1.8 2.9C14 8 12.6 5 10 2 10 6 5 8.5 5 15.3 5 19.2 8 22 12 22z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path class="s" stroke-width="2.4" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path class="s" d="M7 3h7l5 5v13H7z"/><path class="s" d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path class="s" stroke-width="3" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path class="s" stroke-width="3" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect class="s" x="5" y="11" width="14" height="9" rx="2"/><path class="s" d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="4"/><path class="s" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path class="s" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
</svg>

<div class="app">
  <header class="appbar">
    <h1 id="barTitle">Practice</h1>
    <button id="themeBtn" class="btn icon ripple theme-btn" type="button" aria-label="Switch to dark mode" title="Light / Dark mode">
      <svg class="i-moon" width="22" height="22"><use href="#i-moon"/></svg>
      <svg class="i-sun" width="22" height="22"><use href="#i-sun"/></svg>
    </button>
  </header>
  <main id="main">
    <section id="tab-practice" class="tab" aria-label="Practice"><div id="practiceArea"></div></section>
    <section id="tab-doubt" class="tab doubt" hidden aria-label="Doubt">
      <div id="chat" class="chat" aria-live="polite"></div>
      <div class="composer">
        <input id="doubtInput" type="text" maxlength="500" placeholder="Ask a doubt (Hinglish ok)" autocomplete="off" aria-label="Your doubt">
        <button id="doubtSend" class="btn primary icon ripple" type="button" aria-label="Send doubt">
          <svg width="22" height="22"><use href="#i-send"/></svg>
        </button>
      </div>
    </section>
    <section id="tab-progress" class="tab" hidden aria-label="Progress"><div id="progressArea"></div></section>
  </main>
  <nav class="bottom-nav" aria-label="Main">
    <div class="brand" aria-hidden="true"><span class="logo">AI</span><span><b>Practice Tutor</b><small>Learn from your notes</small></span></div>
    <button class="nav-btn active ripple" data-tab="practice" type="button" aria-current="page"><span class="pill"><svg width="24" height="24"><use href="#i-practice"/></svg></span>Practice</button>
    <button class="nav-btn ripple" data-tab="doubt" type="button"><span class="pill"><svg width="24" height="24"><use href="#i-doubt"/></svg></span>Doubt</button>
    <button class="nav-btn ripple" data-tab="progress" type="button"><span class="pill"><svg width="24" height="24"><use href="#i-progress"/></svg></span>Progress</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
